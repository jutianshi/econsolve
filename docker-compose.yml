version: '3.8'

services:
  econsolve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: econsolve-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      # 如果需要固定密钥，取消下面的注释并填入值：
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      # 可选：持久化数据（如果未来接入数据库）
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - econsolve-network

  # 可选：Nginx 反向代理（HTTPS、域名访问）
  nginx:
    image: nginx:alpine
    container_name: econsolve-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt 证书目录（首次部署时创建）
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - econsolve
    networks:
      - econsolve-network
    profiles:
      - with-nginx

volumes:
  app-data:

networks:
  econsolve-network:
    driver: bridge
